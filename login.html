<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish | So‘fi Ollohyor</title><link rel="stylesheet" href="neon.css"></head><body><a class="brand" style="position:absolute;top:20px;left:20px" href="index.html"><span class="brand-mark">SO</span><span><b>SO‘FI OLLOHYOR</b><small>O‘QUV MARKAZI</small></span></a><main class="glass formcard"><div class="eyebrow">Shaxsiy kabinet</div><h1>Xush kelibsiz.</h1><p class="muted">Email va parol bilan tizimga kiring.</p><div id="notice" class="notice hidden"></div><form id="f" class="formstack"><label>Email<input class="field" id="email" type="email" required></label><label>Parol<input class="field" id="password" type="password" minlength="6" required></label><button class="btn btn-primary">Kirish →</button></form><button class="btn" id="google" style="width:100%;margin-top:12px">Google orqali kirish</button><p class="muted">Akkauntingiz yo‘qmi? <a href="register.html">Ro‘yxatdan o‘ting</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const n=document.querySelector('#notice');function msg(t){n.textContent=t;n.classList.remove('hidden')}document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const c=window.sufiClient;if(!c){msg('config.js sozlanmagan.');return}const {error}=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg(error.message);return}await window.sufi.route()};document.querySelector('#google').onclick=async()=>{if(!window.sufiClient){msg('config.js sozlanmagan.');return}const {error}=await window.sufiClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname.replace('login.html','dashboard.html')}});if(error)msg(error.message)};</script></body></html>

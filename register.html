<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ro‘yxatdan o‘tish | So‘fi Ollohyor</title><link rel="stylesheet" href="neon.css"></head><body><main class="glass formcard"><div class="eyebrow">Yangi akkaunt</div><h1>Ro‘yxatdan o‘ting.</h1><div id="notice" class="notice hidden"></div><form id="f" class="formstack"><label>To‘liq ism<input class="field" id="name" required maxlength="100"></label><label>Email<input class="field" id="email" type="email" required></label><label>Parol<input class="field" id="password" type="password" minlength="8" required></label><button class="btn btn-primary">Akkaunt yaratish →</button></form><p class="muted">Yangi akkaunt avtomatik administrator bo‘lmaydi.</p><a href="login.html">Kirish</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const n=document.querySelector('#notice');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const c=window.sufiClient;if(!c){n.textContent='config.js sozlanmagan.';n.classList.remove('hidden');return}const {error}=await c.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:name.value.trim()}}});n.textContent=error?error.message:'Ro‘yxatdan o‘tish so‘rovi yuborildi. Email tasdig‘i talab qilinishi mumkin.';n.classList.remove('hidden')};</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vatan poydevoridagi jonlar: tosh poydevor ichida o'n ikki nur, uning ustida tong otayotgan shahar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".45" stop-color="#2a1f4a"/>
      <stop offset=".72" stop-color="#b4573a"/>
      <stop offset=".86" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#ffd89a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".35" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f2a"/>
      <stop offset="1" stop-color="#16110f"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#0e0a1a"/>
    </linearGradient>
    <radialGradient id="soul" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset=".3" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ff8f3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="girih" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 4 L37 23 L56 30 L37 37 L30 56 L23 37 L4 30 L23 23 Z" fill="none" stroke="#c9a46a" stroke-opacity=".18" stroke-width="1.4"/>
      <circle cx="30" cy="30" r="5" fill="none" stroke="#c9a46a" stroke-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" fill="url(#sky)"/>
  <!-- yulduzlar -->
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.6" opacity=".8"/><circle cx="210" cy="110" r="1.2" opacity=".6"/><circle cx="340" cy="40" r="1.8" opacity=".9"/>
    <circle cx="470" cy="90" r="1.1" opacity=".5"/><circle cx="760" cy="50" r="1.5" opacity=".8"/><circle cx="900" cy="120" r="1.2" opacity=".6"/>
    <circle cx="1030" cy="70" r="1.8" opacity=".9"/><circle cx="1140" cy="140" r="1.1" opacity=".5"/><circle cx="620" cy="30" r="1.3" opacity=".7"/>
    <circle cx="140" cy="180" r="1" opacity=".4"/><circle cx="1080" cy="200" r="1" opacity=".4"/>
  </g>
  <!-- tong quyoshi -->
  <circle cx="600" cy="352" r="230" fill="url(#sun)"/>

  <!-- shahar silueti: gumbazlar, minoralar, peshtoqlar -->
  <g fill="url(#city)">
    <path d="M0 360 L0 300 L60 300 L60 280 L110 280 L110 310 L150 310 L150 360 Z"/>
    <rect x="150" y="250" width="22" height="110"/><path d="M146 250 L176 250 L170 236 L152 236 Z"/><circle cx="161" cy="230" r="7"/>
    <path d="M190 360 L190 300 Q240 230 290 300 L290 360 Z"/><rect x="236" y="214" width="4" height="22"/>
    <path d="M300 360 L300 280 L380 280 L380 360 Z"/><path d="M318 360 L318 300 Q340 270 362 300 L362 360 Z" fill="#2a1f4a" opacity=".6"/>
    <rect x="392" y="200" width="26" height="160"/><path d="M388 200 L422 200 L414 182 L396 182 Z"/><rect x="403" y="166" width="4" height="18"/>
    <path d="M430 360 L430 280 L770 280 L770 360 Z"/>
    <path d="M520 360 L520 250 L680 250 L680 360 Z"/>
    <path d="M548 360 L548 290 Q600 220 652 290 L652 360 Z" fill="#3a2a55" opacity=".55"/>
    <path d="M540 250 Q600 150 660 250 Z"/><rect x="597" y="128" width="6" height="26"/><circle cx="600" cy="124" r="5"/>
    <path d="M440 280 Q480 222 520 280 Z"/><path d="M680 280 Q720 222 760 280 Z"/>
    <rect x="782" y="200" width="26" height="160"/><path d="M778 200 L812 200 L804 182 L786 182 Z"/><rect x="793" y="166" width="4" height="18"/>
    <path d="M820 360 L820 290 L900 290 L900 360 Z"/><path d="M830 290 Q860 240 890 290 Z"/>
    <path d="M910 360 L910 270 L960 270 L960 360 Z"/><rect x="972" y="240" width="18" height="120"/><circle cx="981" cy="234" r="6"/>
    <path d="M1000 360 L1000 300 Q1050 250 1100 300 L1100 360 Z"/><path d="M1100 360 L1100 290 L1200 290 L1200 360 Z"/>
  </g>
  <!-- derazalardagi nur -->
  <g fill="#ffcf6b" opacity=".75">
    <rect x="455" y="300" width="8" height="14" rx="4"/><rect x="480" y="300" width="8" height="14" rx="4"/><rect x="712" y="300" width="8" height="14" rx="4"/><rect x="737" y="300" width="8" height="14" rx="4"/>
    <rect x="845" y="310" width="8" height="12" rx="4"/><rect x="866" y="310" width="8" height="12" rx="4"/><rect x="330" y="300" width="6" height="12" rx="3"/><rect x="40" y="320" width="6" height="12" rx="3"/>
  </g>

  <!-- poydevordan shaharga ko'tarilayotgan nur ustunlari -->
  <g filter="url(#soft)">
    <rect x="80" y="250" width="22" height="160" fill="url(#beam)"/><rect x="175" y="250" width="22" height="160" fill="url(#beam)"/>
    <rect x="270" y="250" width="22" height="160" fill="url(#beam)"/><rect x="365" y="250" width="22" height="160" fill="url(#beam)"/>
    <rect x="460" y="250" width="22" height="160" fill="url(#beam)"/><rect x="555" y="250" width="22" height="160" fill="url(#beam)"/>
    <rect x="623" y="250" width="22" height="160" fill="url(#beam)"/><rect x="718" y="250" width="22" height="160" fill="url(#beam)"/>
    <rect x="813" y="250" width="22" height="160" fill="url(#beam)"/><rect x="908" y="250" width="22" height="160" fill="url(#beam)"/>
    <rect x="1003" y="250" width="22" height="160" fill="url(#beam)"/><rect x="1098" y="250" width="22" height="160" fill="url(#beam)"/>
  </g>

  <!-- tosh poydevor -->
  <rect x="0" y="360" width="1200" height="280" fill="url(#stone)"/>
  <rect x="0" y="360" width="1200" height="280" fill="url(#girih)"/>
  <rect x="0" y="356" width="1200" height="10" fill="#5a4636"/>
  <g stroke="#0b0807" stroke-width="4" fill="none" opacity=".9">
    <path d="M0 450 H1200 M0 540 H1200"/>
    <path d="M140 366 V450 M330 366 V450 M520 366 V450 M710 366 V450 M900 366 V450 M1090 366 V450"/>
    <path d="M45 450 V540 M235 450 V540 M425 450 V540 M615 450 V540 M805 450 V540 M995 450 V540"/>
    <path d="M140 540 V640 M330 540 V640 M520 540 V640 M710 540 V640 M900 540 V640 M1090 540 V640"/>
  </g>
  <!-- o'n ikki jon — o'n ikki nur (har biri bir jadid) -->
  <g>
    <g transform="translate(91 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
    <g transform="translate(186 408)"><circle r="40" fill="url(#soul)"/><path d="M0 -14 C6 -5 8 0 0 11 C-8 0 -6 -5 0 -14 Z" fill="#fff4cc"/></g>
    <g transform="translate(281 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
    <g transform="translate(376 408)"><circle r="40" fill="url(#soul)"/><path d="M0 -14 C6 -5 8 0 0 11 C-8 0 -6 -5 0 -14 Z" fill="#fff4cc"/></g>
    <g transform="translate(471 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
    <g transform="translate(566 408)"><circle r="52" fill="url(#soul)"/><path d="M0 -18 C8 -7 10 0 0 14 C-10 0 -8 -7 0 -18 Z" fill="#fff4cc"/></g>
    <g transform="translate(634 408)"><circle r="52" fill="url(#soul)"/><path d="M0 -18 C8 -7 10 0 0 14 C-10 0 -8 -7 0 -18 Z" fill="#fff4cc"/></g>
    <g transform="translate(729 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
    <g transform="translate(824 408)"><circle r="40" fill="url(#soul)"/><path d="M0 -14 C6 -5 8 0 0 11 C-8 0 -6 -5 0 -14 Z" fill="#fff4cc"/></g>
    <g transform="translate(919 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
    <g transform="translate(1014 408)"><circle r="40" fill="url(#soul)"/><path d="M0 -14 C6 -5 8 0 0 11 C-8 0 -6 -5 0 -14 Z" fill="#fff4cc"/></g>
    <g transform="translate(1109 408)"><circle r="46" fill="url(#soul)"/><path d="M0 -16 C7 -6 9 0 0 12 C-9 0 -7 -6 0 -16 Z" fill="#fff4cc"/></g>
  </g>
  <!-- poydevordagi ochiq kitob va qalam -->
  <g transform="translate(600 560)" fill="none" stroke="#d6b77a" stroke-width="3" opacity=".75" stroke-linejoin="round">
    <path d="M-70 -18 Q-35 -32 0 -18 Q35 -32 70 -18 L70 22 Q35 8 0 22 Q-35 8 -70 22 Z"/>
    <path d="M0 -18 V22"/><path d="M-56 -8 Q-30 -18 -10 -8 M-56 4 Q-30 -6 -10 4 M10 -8 Q30 -18 56 -8 M10 4 Q30 -6 56 4" stroke-width="1.6"/>
  </g>
  <rect width="1200" height="640" fill="none" stroke="#c9a46a" stroke-opacity=".3" stroke-width="6"/>
</svg>

<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ariza | So‘fi Ollohyor</title><link rel="stylesheet" href="neon.css"></head><body><main class="glass formcard"><div class="eyebrow">Kursga yozilish</div><h1>Ariza qoldiring.</h1><p class="muted">Markaz siz bilan bog‘lanishi uchun ma’lumotlarni kiriting.</p><div id="notice" class="notice hidden"></div><form id="f" class="formstack"><label>To‘liq ism<input class="field" id="name" required maxlength="100"></label><label>Telefon<input class="field" id="phone" required maxlength="30"></label><label>Kurs<select class="field" id="course" required><option value="">Tanlang</option><option>Matematika</option><option>Ingliz tili</option><option>Informatika</option><option>Boshqa</option></select></label><label>Izoh<textarea class="field" id="message" rows="3" maxlength="1000"></textarea></label><button class="btn btn-primary">Ariza yuborish →</button></form><a href="index.html">← Bosh sahifa</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const n=document.querySelector('#notice');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const c=window.sufiClient;if(!c){n.textContent='config.js sozlanmagan.';n.classList.remove('hidden');return}const {error}=await c.from('applications').insert({full_name:document.querySelector('#name').value.trim(),phone:document.querySelector('#phone').value.trim(),course:document.querySelector('#course').value,message:document.querySelector('#message').value.trim()});n.textContent=error?'Ariza yuborilmadi. applications INSERT RLS siyosatini tekshiring: '+error.message:'Arizangiz yuborildi. Rahmat!';n.classList.remove('hidden');if(!error)e.target.reset()};</script></body></html>
